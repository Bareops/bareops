on:
  pull_request: {}
  push:
    branches:
      - 'main'
jobs:
  build_cli:
    runs-on: docker
    container:
      image: bareops-ci
    steps:
      - name: Check out repository code
        uses: https://code.forgejo.org/actions/checkout@v3

      - name: Build with Cargo
        run: |
          cargo build 
