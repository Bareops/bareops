on:
  pull_request: {}
  push:
    branches:
      - 'main'

jobs:
  clippy:
    runs-on: docker
    container:
      image: bareops-ci
    steps:
      - name: Check out repository code
        uses: https://code.forgejo.org/actions/checkout@v3

      - name: Run Clippy
        run: |
          cargo clippy
