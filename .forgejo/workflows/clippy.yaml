on:
  workflow_dispatch: {}

jobs:
  clippy:
    runs-on: docker
    container:
      image: bareops-ci
    steps:
      - name: Install capnproto
        run: apt update && apt install -yy capnproto

      - name: Check out repository code
        uses: https://code.forgejo.org/actions/checkout@v3

      - name: Run Clippy
        run: |
          cargo clippy
